apiVersion: v1
kind: ServiceAccount
metadata:
  name: medi-frontend-sa
  namespace: medistock
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medi-backend-sa
  namespace: medistock
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medi-db-sa
  namespace: medistock
---
# Le backend peut lire SEULEMENT le secret de connexion DB (moindre privilège)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medi-backend-secret-reader
  namespace: medistock
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["medi-db-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medi-backend-secret-reader-binding
  namespace: medistock
subjects:
  - kind: ServiceAccount
    name: medi-backend-sa
    namespace: medistock
roleRef:
  kind: Role
  name: medi-backend-secret-reader
  apiGroup: rbac.authorization.k8s.io
# medi-frontend-sa n'a volontairement AUCUN rôle -> zéro accès aux Secrets/volumes
